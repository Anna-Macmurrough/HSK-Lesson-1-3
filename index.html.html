<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉语学习平台 - 新HSK3.0 第1-3课</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg: #faf9f4;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --accent: #297a2e;
  --accent-soft: rgba(41, 122, 46, .14);
  --accent2: #d97706;
  --accent2-soft: rgba(217, 119, 6, .14);
  --border: rgba(15, 23, 42, .08);
}

* {
  font-family: 'Fredoka', sans-serif;
  box-sizing: border-box;
}

body {
  background: radial-gradient(800px 400px at 20% -10%, var(--accent-soft), transparent 70%), var(--bg);
  color: var(--text);
  margin: 0;
  min-height: 100vh;
  padding: 24px;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 32px;
}

.header .eyebrow {
  font-size: 11px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 8px;
}

.header h1 {
  font-size: 2.5rem;
  font-weight: 700;
  margin: 0 0 8px;
  line-height: 1.2;
}

.header h1 span {
  background: linear-gradient(100deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.header p {
  color: var(--muted);
  margin: 0;
  font-size: 1.05rem;
}

/* Lesson Navigation */
.lesson-nav {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.lesson-btn {
  padding: 14px 24px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  transition: all .25s;
  text-align: left;
  width: 100%;
}

.lesson-btn:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(41, 122, 46, .1);
}

.lesson-btn.active {
  background: var(--accent-soft);
  border-color: var(--accent);
}

.lesson-btn-inner {
  display: flex;
  align-items: center;
  gap: 12px;
}

.lesson-num {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 1.2rem;
  flex-shrink: 0;
}

.lesson-num.l1 { background: var(--accent-soft); color: var(--accent); }
.lesson-num.l2 { background: var(--accent2-soft); color: var(--accent2); }
.lesson-num.l3 { background: rgba(13, 148, 136, .14); color: #0d9488; }

.lesson-title { font-weight: 600; font-size: 1.05rem; }
.lesson-subtitle { color: var(--muted); font-size: .85rem; margin-top: 2px; }

/* Tab Navigation */
.tab-nav {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.tab-btn {
  padding: 10px 20px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
  transition: all .25s;
  font-weight: 500;
  font-size: .95rem;
}

.tab-btn:hover {
  border-color: var(--accent);
  color: var(--text);
}

.tab-btn.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--text);
}

/* Content Area */
.content-area {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  min-height: 400px;
}

.content-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.content-header h2 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 600;
}

.content-header .subtitle {
  color: var(--muted);
  font-size: .9rem;
}

.content-header .hint {
  color: var(--muted);
  font-size: .85rem;
}

/* Vocab Cards */
.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.card-flip {
  perspective: 1000px;
  height: 180px;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform .6s;
  transform-style: preserve-3d;
  cursor: pointer;
}

.card-flipped .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card-front {
  background: var(--card);
  border: 1px solid var(--border);
}

.card-back {
  background: linear-gradient(135deg, var(--accent-soft), var(--accent2-soft));
  border: 1px solid var(--accent);
  transform: rotateY(180deg);
}

.card-front .hanzi {
  font-size: 2.2rem;
  font-weight: 600;
  color: var(--text);
}

.card-back .hanzi {
  font-size: 1.8rem;
  font-weight: 600;
  color: var(--accent);
}

.pinyin {
  color: var(--accent);
  font-size: .95rem;
  font-weight: 500;
  margin-top: 8px;
}

.meaning {
  color: var(--text);
  font-weight: 500;
  margin-top: 6px;
}

.example {
  color: var(--text);
  font-size: .8rem;
  margin-top: 8px;
  font-style: italic;
  text-align: center;
  padding: 0 4px;
  line-height: 1.4;
}

.flip-hint {
  font-size: .7rem;
  color: var(--muted);
  margin-top: 12px;
}

/* Navigation dots */
.nav-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
}

.nav-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--border);
  cursor: pointer;
  transition: all .2s;
}

.nav-dot.active {
  background: var(--accent);
  transform: scale(1.3);
}

/* Grammar */
.objectives {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}

.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: .75rem;
  font-weight: 500;
}

.tag-accent {
  background: var(--accent-soft);
  color: var(--accent);
}

.tag-warm {
  background: var(--accent2-soft);
  color: var(--accent2);
}

.grammar-box {
  background: var(--accent-soft);
  border-left: 4px solid var(--accent);
  padding: 16px 20px;
  border-radius: 0 12px 12px 0;
  margin: 16px 0;
}

.grammar-title {
  font-weight: 600;
  font-size: 1.1rem;
  color: var(--accent);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
}

.grammar-num {
  display: inline-block;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  text-align: center;
  line-height: 28px;
  font-size: .85rem;
  margin-right: 10px;
  flex-shrink: 0;
}

.grammar-content {
  margin-left: 38px;
  color: var(--text);
  line-height: 1.7;
}

.grammar-examples {
  margin-left: 38px;
  margin-top: 12px;
  padding: 12px;
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
}

.grammar-examples .label {
  font-size: .8rem;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}

.grammar-examples .ex {
  line-height: 1.8;
}

/* Dialogue */
.dialogue-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.dialogue-line {
  display: flex;
}

.dialogue-line.left { justify-content: flex-start; }
.dialogue-line.right { justify-content: flex-end; }

.dialogue-bubble {
  max-width: 75%;
  border-radius: 16px;
  padding: 14px 18px;
  border: 1px solid;
}

.dialogue-line.left .dialogue-bubble {
  background: var(--accent-soft);
  border-color: var(--accent);
  border-bottom-left-radius: 4px;
}

.dialogue-line.right .dialogue-bubble {
  background: var(--accent2-soft);
  border-color: var(--accent2);
  border-bottom-right-radius: 4px;
}

.dialogue-speaker {
  font-size: .75rem;
  font-weight: 600;
  margin-bottom: 4px;
}

.dialogue-line.left .dialogue-speaker { color: var(--accent); }
.dialogue-line.right .dialogue-speaker { color: var(--accent2); }

.dialogue-text {
  font-size: 1.15rem;
  font-weight: 500;
  color: var(--text);
}

.dialogue-en {
  color: var(--muted);
  font-size: .85rem;
  margin-top: 4px;
  font-style: italic;
}

/* Quiz */
.quiz-header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.score-display {
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: 600;
  color: var(--accent);
}

.progress-display {
  color: var(--muted);
  font-size: .85rem;
}

.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 24px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width .4s;
  border-radius: 3px;
}

.progress-message {
  text-align: center;
  margin-top: 12px;
  margin-bottom: 24px;
  color: var(--muted);
  font-size: .9rem;
}

.quiz-question {
  margin-bottom: 20px;
  padding: 16px;
  background: var(--bg);
  border-radius: 14px;
  border: 1px solid var(--border);
}

.quiz-question-title {
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: flex-start;
}

.quiz-qnum {
  display: inline-block;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  text-align: center;
  line-height: 24px;
  font-size: .8rem;
  margin-right: 10px;
  flex-shrink: 0;
  margin-top: 2px;
}

.quiz-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
}

.quiz-option {
  padding: 12px 18px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  transition: all .2s;
  text-align: left;
  width: 100%;
  font-size: .95rem;
}

.quiz-option:hover:not(.disabled) {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.quiz-option.correct {
  background: rgba(13, 150, 105, .12);
  border-color: #0d9669;
  color: #065f46;
}

.quiz-option.wrong {
  background: rgba(220, 38, 38, .1);
  border-color: #dc2626;
  color: #991b1b;
}

.quiz-option.disabled {
  pointer-events: none;
  opacity: .7;
}

.quiz-option .letter {
  font-weight: 600;
  margin-right: 8px;
  color: var(--accent);
}

.reset-btn {
  padding: 12px 24px;
  border-radius: 12px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  color: var(--text);
  cursor: pointer;
  font-weight: 500;
  font-size: 1rem;
  transition: all .2s;
}

.reset-btn:hover {
  background: var(--accent);
  color: #fff;
}

/* Animations */
.fade-in {
  animation: fadeIn .4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Footer */
.footer {
  text-align: center;
  margin-top: 32px;
  padding: 20px;
  color: var(--muted);
  font-size: .85rem;
}

/* Responsive */
@media (max-width: 640px) {
  body { padding: 16px; }
  .header h1 { font-size: 1.8rem; }
  .content-area { padding: 18px; }
  .vocab-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .card-flip { height: 160px; }
  .card-front .hanzi { font-size: 1.8rem; }
  .dialogue-bubble { max-width: 88%; }
}
</style>
</head>

  <div class="lesson-nav">

  <!-- Tab Navigation -->

  <!-- Content Area -->
  <div class="content-area" id="content-area">

  </div>

  <!-- Footer -->
  <div class="footer">
    新HSK教程1 · 第1-3课 | New HSK Course 1 · Lessons 1-3
  </div>

</div>

// ==================== STATE ====================
let currentLesson = 1;
let currentTab = 'vocab';
let currentVocabPage = 0;
let quizScore = 0;
let quizAnswered = [];

// ==================== RENDER FUNCTIONS ====================
function switchLesson(num) {
  currentLesson = num;
  currentVocabPage = 0;
  quizScore = 0;
  quizAnswered = [];
  
  document.querySelectorAll('.lesson-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i + 1 === num);
  });
  
  renderContent();
}

function switchTab(tab) {
  currentTab = tab;
  quizScore = 0;
  quizAnswered = [];
  
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  document.getElementById('tab-' + tab).classList.add('active');
  
  renderContent();
}

function renderContent() {
  const area = document.getElementById('content-area');
  area.classList.remove('fade-in');
  void area.offsetWidth;
  area.classList.add('fade-in');
  
  switch(currentTab) {
    case 'vocab': renderVocab(area); break;
    case 'grammar': renderGrammar(area); break;
    case 'dialogue': renderDialogue(area); break;
    case 'quiz': renderQuiz(area); break;
  }
}

function renderVocab(area) {
  const lesson = lessons[currentLesson];
  const vocab = lesson.vocab;
  const perPage = 6;
  const totalPages = Math.ceil(vocab.length / perPage);
  const start = currentVocabPage * perPage;
  const items = vocab.slice(start, start + perPage);
  
  let html = `
    <div class="content-header">
      <div>
        <h2>${lesson.title}</h2>
        <div class="subtitle">${lesson.subtitle} · 生词 New Words</div>
      </div>
      <div class="hint">点击卡片翻转查看释义 · Click cards to flip</div>
    </div>
    <div class="vocab-grid">
  `;
  
  items.forEach((item, idx) => {
    html += `
      <div class="card-flip" onclick="this.classList.toggle('card-flipped')">
        <div class="card-inner">
          <div class="card-front">
            <div class="hanzi">${item.hanzi}</div>
            <div class="pinyin">${item.pinyin}</div>
            <div class="flip-hint">点击翻转 Click to flip</div>
          </div>
          <div class="card-back">
            <div class="hanzi">${item.hanzi}</div>
            <div class="pinyin">${item.pinyin}</div>
            <div class="meaning">${item.meaning}</div>
            <div class="example">${item.example}</div>
          </div>
        </div>
      </div>
    `;
  });
  
  html += `</div>`;
  
  if (totalPages > 1) {
    html += `<div class="nav-dots">`;
    for (let i = 0; i < totalPages; i++) {
      html += `<div class="nav-dot ${i === currentVocabPage ? 'active' : ''}" onclick="goVocabPage(${i})"></div>`;
    }
    html += `</div>`;
  }
  
  area.innerHTML = html;
}

function goVocabPage(p) {
  currentVocabPage = p;
  renderContent();
}

function renderGrammar(area) {
  const lesson = lessons[currentLesson];
  
  let html = `
    <div class="content-header">
      <div>
        <h2>${lesson.title}</h2>
        <div class="subtitle">${lesson.subtitle} · 语法 Grammar Points</div>
      </div>
    </div>
    <div class="objectives">
      <span class="tag tag-accent">学习目标 Learning Objectives:</span>
  `;
  lesson.objectives.forEach(obj => {
    html += `<span class="tag tag-warm">${obj}</span>`;
  });
  html += `</div>`;
  
  lesson.grammar.forEach((g, idx) => {
    html += `
      <div class="grammar-box">
        <div class="grammar-title">
          <span class="grammar-num">${idx + 1}</span>
          ${g.title}
        </div>
        <div class="grammar-content">${g.content}</div>
        <div class="grammar-examples">
          <div class="label">例句 Examples:</div>
          ${g.examples.map(e => `<div class="ex">${e}</div>`).join('')}
        </div>
      </div>
    `;
  });
  
  area.innerHTML = html;
}

function renderDialogue(area) {
  const lesson = lessons[currentLesson];
  
  let html = `
    <div class="content-header">
      <div>
        <h2>${lesson.title}</h2>
        <div class="subtitle">${lesson.subtitle} · 情景对话 Dialogue</div>
      </div>
    </div>
    <div class="dialogue-container">
  `;
  
  lesson.dialogue.forEach((line, idx) => {
    const isLeft = idx % 2 === 0;
    html += `
      <div class="dialogue-line ${isLeft ? 'left' : 'right'}">
        <div class="dialogue-bubble">
          <div class="dialogue-speaker">${line.speaker}</div>
          <div class="dialogue-text">${line.text}</div>
          <div class="pinyin">${line.pinyin}</div>
          <div class="dialogue-en">${line.en}</div>
        </div>
      </div>
    `;
  });
  
  html += `</div>`;
  area.innerHTML = html;
}

function renderQuiz(area) {
  const lesson = lessons[currentLesson];
  const quiz = lesson.quiz;
  
  if (quizAnswered.length === 0) {
    quizAnswered = new Array(quiz.length).fill(null);
  }
  
  const allAnswered = quizAnswered.every(a => a !== null);
  
  let html = `
    <div class="content-header">
      <div>
        <h2>${lesson.title}</h2>
        <div class="subtitle">${lesson.subtitle} · 小测验 Quiz</div>
      </div>
      <div class="quiz-header-right">
        ${allAnswered 
          ? `<div class="score-display">得分 Score: ${quizScore}/${quiz.length}</div>` 
          : `<div class="progress-display">已答 ${quizAnswered.filter(a=>a!==null).length}/${quiz.length}</div>`
        }
      </div>
    </div>
  `;
  
  if (allAnswered) {
    const pct = Math.round(quizScore / quiz.length * 100);
    let msg = '';
    if (pct >= 80) msg = '太棒了！Excellent work!';
    else if (pct >= 60) msg = '不错！继续加油！Good job! Keep practicing!';
    else msg = '再试一次！Try again!';
    
    html += `
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-message">${msg}</div>
    `;
  }
  
  quiz.forEach((q, qIdx) => {
    const answered = quizAnswered[qIdx];
    html += `
      <div class="quiz-question">
        <div class="quiz-question-title">
          <span class="quiz-qnum">${qIdx + 1}</span>
          <span>${q.q}</span>
        </div>
        <div class="quiz-options">
    `;
    
    q.options.forEach((opt, oIdx) => {
      let cls = 'quiz-option';
      if (answered !== null) {
        cls += ' disabled';
        if (oIdx === q.answer) cls += ' correct';
        else if (oIdx === answered && answered !== q.answer) cls += ' wrong';
      }
      const letter = String.fromCharCode(65 + oIdx);
      html += `<button class="${cls}" onclick="answerQuiz(${qIdx}, ${oIdx})"><span class="letter">${letter}.</span>${opt}</button>`;
    });
    
    html += `</div></div>`;
  });
  
  if (allAnswered) {
    html += `<button class="reset-btn" onclick="resetQuiz()">重新练习 Try Again</button>`;
  }
  
  area.innerHTML = html;
}

function answerQuiz(qIdx, oIdx) {
  if (quizAnswered[qIdx] !== null) return;
  quizAnswered[qIdx] = oIdx;
  if (oIdx === lessons[currentLesson].quiz[qIdx].answer) {
    quizScore++;
  }
  renderContent();
}

function resetQuiz() {
  quizScore = 0;
  quizAnswered = [];
  renderContent();
}

// Initial render
renderContent();

})();
</script>
